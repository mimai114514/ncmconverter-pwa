name: Deploy Web to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --no-tree-shake-icons

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ncmconverter-pwa # Optional: Ensure this matches your Cloudflare Pages project name if already created, or it will create/deploy to this name.
          directory: build/web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main # Optional: defaults to the branch that triggered the workflow
          workingDirectory: .
          wranglerVersion: '3' # Optional: defaults to the latest version
